<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141e"><title>45° BREAK</title>
<style>
:root{color-scheme:dark;--mint:#c5ff67;--ink:#10141e;--dim:#97a1b4}*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fc;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.app{width:100%;max-width:480px;height:100svh;height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--ink);padding:max(12px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));gap:12px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:950;letter-spacing:-1.5px}.brand span{color:var(--mint)}.icon{background:#222a39;border:1px solid #374055;border-radius:12px;min-width:44px;height:44px;font-size:18px}.stats{display:flex;justify-content:space-between;align-items:center}.label{font-size:11px;letter-spacing:1.6px;color:var(--dim)}.value{font-size:20px;font-weight:750;margin-top:2px}.stats>div:last-child{text-align:right}#lives{color:#ff8fb7;letter-spacing:5px}.arena{position:relative;flex:1;min-height:160px;border:1px solid #30394b;border-radius:20px;overflow:hidden;background:#131a27;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1223b8;backdrop-filter:blur(6px);padding:20px;text-align:center}.overlay[hidden]{display:none}.card{max-width:300px}.eyebrow{font-size:12px;color:var(--mint);letter-spacing:3px;font-weight:800}h1{font-size:42px;line-height:1.05;letter-spacing:-2px;margin:14px 0}p{font-size:14px;line-height:1.8;color:#b6c0d3;margin:12px 0 20px}.primary{border:0;background:var(--mint);color:#18220c;padding:16px 28px;border-radius:14px;font-weight:850;width:100%;font-size:16px}.charge{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:750;min-height:22px}.charge small{color:var(--dim);font-size:12px;font-weight:500}#charge{color:var(--mint)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.turn{height:72px;border:1px solid #c5ff6760;border-radius:18px;background:#c5ff6714;display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px;font-weight:800;color:var(--mint);touch-action:none}.turn .symbol{font-size:32px;line-height:1}.turn:active{transform:scale(.97);background:#c5ff6733}.turn:disabled{color:#667186;border-color:#30394b;background:#1a2230}.hint{text-align:center;color:var(--dim);font-size:12px;margin:0}.key{font-size:11px;border:1px solid currentColor;padding:2px 5px;border-radius:4px;opacity:.7}@media(max-height:650px){.app{gap:7px;padding-top:7px}.turn{height:55px}.brand{font-size:24px}.value{font-size:16px}h1{font-size:32px}p{margin:10px 0}}@media(pointer:coarse){.key{display:none}}
</style></head><body><main class="app"><header><div class="brand">45° <span>BREAK</span></div><button id="pause" class="icon" aria-label="一時停止">Ⅱ</button></header><div class="stats"><div><div class="label">SCORE</div><div class="value" id="score">0000</div></div><div><div class="label">BLOCKS</div><div class="value" id="blocks">84 / 84</div></div><div><div class="label">LIVES</div><div class="value" id="lives">●●●</div></div></div><section class="arena" aria-label="ゲーム画面。指またはマウスでパドルを移動"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">ONE BOUNCE. ONE TURN.</div><h1 id="title">その一球を、<br>曲げろ。</h1><p id="message">中央の隙間から、ブロックの奥へ。<br>左右と上の通路で連続反射を狙おう。<br>横スライドで移動、左右フリックで<br>斜め左／右45°へ。PCは←／→キー。</p><button class="primary" id="start">プレイする</button><button id="restart" style="margin-top:14px;background:none;border:0;color:#b6c0d3;padding:10px" hidden>最初からやり直す</button></div></div></section><div class="charge" aria-live="polite"><span id="charge">TURN — 待機中</span><small>パドルで反射すると充電</small></div><p class="hint">ドラッグで移動 · 素早く左右に払って離すと方向転換<br>PC：マウスで移動・← / →で方向転換</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=360,H=520,R=6,PY=475,PW=76;
let mode='intro',ball,paddle=180,bricks=[],particles=[],trail=[],score=0,lives=3,charged=false,last=0,flash=0;
const colors=['#c5ff67','#7aebd3','#86a9ff','#b59aff'];
function makeBricks(){const result=[];for(const start of [44,212])for(let row=0;row<7;row++)for(let sub=0;sub<2;sub++)for(let col=0;col<3;col++)result.push({x:start+col*36,y:64+row*26+(row>=3?36:0)+sub*12,w:32,h:10,c:colors[Math.floor(row/2)],alive:true});return result;}
function hud(){ $('score').textContent=String(score).padStart(4,'0');$('blocks').textContent=bricks.filter(b=>b.alive).length+' / '+bricks.length;$('lives').textContent='●'.repeat(lives)+'○'.repeat(3-lives);$('charge').textContent=charged?'TURN READY — 1回使える':mode==='playing'?'RECHARGING — パドルで返そう':'TURN — 待機中';$('charge').style.color=charged?'#c5ff67':'#97a1b4'; }
function show(title,message,button,eyebrow){$('title').innerHTML=title;$('message').innerHTML=message;$('start').textContent=button;$('eyebrow').textContent=eyebrow;$('overlay').hidden=false;$('restart').hidden=mode!=='paused';hud()}
function serve(){ball={x:paddle,y:PY-R-2,vx:105,vy:-265};charged=false;trail=[];mode='ready';show('次の一球。','パドルの位置を決めて、スタート。<br>方向転換はパドルで返すと使えます。','ボールを発射','READY TO BREAK')}
function reset(){score=0;lives=3;paddle=180;particles=[];bricks=[];bricks=makeBricks();serve()}
function rotate(dir){if(mode!=='playing'||!charged)return false;const speed=Math.hypot(ball.vx,ball.vy),vertical=ball.vy>0?1:-1;ball.vx=dir*speed/Math.sqrt(2);ball.vy=vertical*speed/Math.sqrt(2);charged=false;flash=.18;burst(ball.x,ball.y,'#c5ff67',12);hud();return true}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,c})}}
function pause(){if(mode==='playing'){mode='paused';show('ひと休み。','準備ができたら、続きを。','再開する','PAUSED')}else if(mode==='paused')resume()}
function resume(){mode='playing';$('overlay').hidden=true;last=0;hud()}
$('start').onclick=()=>{if(mode==='intro'||mode==='win'||mode==='lose'){reset();resume()}else resume()};$('pause').onclick=pause;$('restart').onclick=()=>{reset();resume()};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='arrowright')e.preventDefault();if(e.repeat)return;if(k==='arrowleft')rotate(-1);if(k==='arrowright')rotate(1);if(k==='escape'||k==='p')pause();if(k==='r'){reset();resume()}});
let drag=null,gesture=null;function move(e){const rect=canvas.getBoundingClientRect();paddle=Math.max(PW/2+8,Math.min(W-PW/2-8,(e.clientX-rect.left)/rect.width*W));if(mode==='ready'&&ball)ball.x=paddle}
function trackGesture(e){if(!gesture||gesture.used)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,age=e.timeStamp-gesture.t;
if(age>0&&age<=240&&Math.abs(dx)>=36&&Math.abs(dx)/age>=.55&&Math.abs(dx)>Math.abs(dy)*1.5){rotate(dx<0?-1:1);gesture.used=true;}}
canvas.addEventListener('pointerdown',e=>{if(drag!==null)return;drag=e.pointerId;gesture={x:e.clientX,y:e.clientY,t:e.timeStamp,used:false};canvas.setPointerCapture(e.pointerId);if(e.pointerType==='mouse')move(e)});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){move(e);return}if(e.pointerId!==drag)return;move(e)});
canvas.addEventListener('pointerup',e=>{if(e.pointerId!==drag)return;if(e.pointerType!=='mouse')trackGesture(e);drag=null;gesture=null});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===drag){drag=null;gesture=null}});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('blur',()=>{if(mode==='playing')pause()});
function step(dt){if(mode!=='playing')return;const n=Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/3),s=dt/n;for(let i=0;i<n;i++){const ox=ball.x,oy=ball.y;ball.x+=ball.vx*s;ball.y+=ball.vy*s;if(ball.x<R){ball.x=R;ball.vx=Math.abs(ball.vx)}if(ball.x>W-R){ball.x=W-R;ball.vx=-Math.abs(ball.vx)}if(ball.y<R){ball.y=R;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&oy+R<=PY&&ball.y+R>=PY&&ball.x+R>=paddle-PW/2&&ball.x-R<=paddle+PW/2){ball.y=PY-R;let a=Math.max(-1,Math.min(1,(ball.x-paddle)/(PW/2)))*1.03;const speed=Math.min(390,Math.hypot(ball.vx,ball.vy)+4);ball.vx=Math.sin(a)*speed;ball.vy=-Math.cos(a)*speed;charged=true;burst(ball.x,PY,'#c5ff67',7);hud()}
for(const b of bricks){if(!b.alive||ball.x+R<=b.x||ball.x-R>=b.x+b.w||ball.y+R<=b.y||ball.y-R>=b.y+b.h)continue;b.alive=false;score+=100;burst(b.x+b.w/2,b.y+b.h/2,b.c,12);if(oy+R<=b.y){ball.y=b.y-R;ball.vy=-Math.abs(ball.vy)}else if(oy-R>=b.y+b.h){ball.y=b.y+b.h+R;ball.vy=Math.abs(ball.vy)}else if(ox<b.x){ball.x=b.x-R;ball.vx=-Math.abs(ball.vx)}else{ball.x=b.x+b.w+R;ball.vx=Math.abs(ball.vx)}hud();if(bricks.every(b=>!b.alive)){mode='win';charged=false;show('ALL CLEAR!',bricks.length+'ブロック撃破。<br>SCORE '+score+' — 見事な方向転換！','もう一度プレイ','YOU BROKE THE PATTERN');return}break}
if(ball.y-R>H){lives--;charged=false;if(lives===0){mode='lose';show('もう一度、<br>曲げよう。','SCORE '+score+'<br>パドルで返して、方向転換のチャンスを。','リトライ','GAME OVER')}else serve();return}}}
function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(dt){ctx.clearRect(0,0,W,H);ctx.fillStyle='#344058';for(let x=18;x<W;x+=24)for(let y=18;y<H;y+=24){ctx.globalAlpha=.4;ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1;round(0,0,W,58,0,'#7aebd309');round(0,58,38,226,0,'#7aebd309');round(322,58,38,226,0,'#7aebd309');round(154,58,52,226,0,'#c5ff670b');round(38,142,284,30,0,'#7aebd309');for(const b of bricks)if(b.alive){round(b.x,b.y,b.w,b.h,3,b.c);round(b.x+3,b.y+2,b.w-6,1,1,'#ffffff40')}
ctx.strokeStyle='#ffffff12';ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(12,PY+25);ctx.lineTo(W-12,PY+25);ctx.stroke();ctx.setLineDash([]);
if(ball){if(mode==='playing'){trail.push({x:ball.x,y:ball.y});if(trail.length>12)trail.shift()}trail.forEach((p,i)=>{ctx.globalAlpha=i/trail.length*.22;ctx.fillStyle='#d8edff';ctx.beginPath();ctx.arc(p.x,p.y,R*i/trail.length,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.shadowColor=charged?'#c5ff67':'#ffffff';ctx.shadowBlur=15;ctx.fillStyle=charged?'#d5ff93':'#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,7);ctx.fill();ctx.shadowBlur=0}
round(paddle-PW/2,PY,PW,10,5,'#c5ff67');round(paddle-13,PY+3,26,2,1,'#53752b');for(const p of particles){if(mode==='playing'){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}ctx.globalAlpha=Math.max(0,p.t*2);round(p.x,p.y,3,3,1,p.c)}particles=particles.filter(p=>p.t>0);ctx.globalAlpha=1;if(flash>0){flash-=dt;ctx.fillStyle='rgba(197,255,103,'+Math.max(0,flash*.25)+')';ctx.fillRect(0,0,W,H)}}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}new ResizeObserver(resize).observe(canvas);
function frame(t){const dt=last?Math.min((t-last)/1000,.035):0;last=t;step(dt);draw(dt);requestAnimationFrame(frame)}
bricks=makeBricks();ball={x:180,y:PY-R-2,vx:105,vy:-265};resize();hud();requestAnimationFrame(frame);
</script></body></html>
